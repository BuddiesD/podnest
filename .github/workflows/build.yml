name: Build and Push

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "TAGS=ghcr.io/${{ github.repository_owner }}/podnest:latest,ghcr.io/${{ github.repository_owner }}/podnest:${VERSION}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TAGS=ghcr.io/${{ github.repository_owner }}/podnest:beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "TAGS=ghcr.io/${{ github.repository_owner }}/podnest:develop,ghcr.io/${{ github.repository_owner }}/podnest:dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.TAGS }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-pdnctl:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build pdnctl binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X podnest/internal/version.AppVersion=${{ github.ref_name }}" \
            -o pdnctl-linux-amd64 ./cmd/pdnctl/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X podnest/internal/version.AppVersion=${{ github.ref_name }}" \
            -o pdnctl-linux-arm64 ./cmd/pdnctl/

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdnctl-linux-amd64
            pdnctl-linux-arm64

  cleanup-previous:
    runs-on: ubuntu-latest
    needs: [build-and-push, release-pdnctl]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/podnest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous release
        id: prev
        run: |
          PREV=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 10 --json tagName --jq '.[].tagName' | grep -vx "${{ github.ref_name }}" | head -n 1 || true)
          echo "TAG=${PREV}" >> $GITHUB_OUTPUT

      - name: Delete previous image
        if: steps.prev.outputs.TAG != ''
        run: |
          PREV="${{ steps.prev.outputs.TAG }}"
          PKG="/users/${{ github.repository_owner }}/packages/container/podnest/versions"
          gh api --paginate "$PKG" --jq '.[] | [.id, .name, (.metadata.container.tags | join(","))] | @tsv' > versions.tsv
          INDEX_ID=$(awk -F'\t' -v t="$PREV" '$3==t {print $1}' versions.tsv)
          if [[ -z "$INDEX_ID" ]]; then
            echo "No image found tagged only ${PREV}"
            exit 0
          fi
          CHILDREN=$(docker buildx imagetools inspect --raw "${IMAGE}:${PREV}" | jq -r '.manifests[]?.digest')
          gh api -X DELETE "${PKG}/${INDEX_ID}"
          for D in $CHILDREN; do
            ID=$(awk -F'\t' -v d="$D" '$2==d && $3=="" {print $1}' versions.tsv)
            if [[ -n "$ID" ]]; then
              gh api -X DELETE "${PKG}/${ID}"
            fi
          done

      - name: Delete previous release and tag
        if: steps.prev.outputs.TAG != ''
        run: gh release delete "${{ steps.prev.outputs.TAG }}" --repo "${{ github.repository }}" --cleanup-tag --yes
